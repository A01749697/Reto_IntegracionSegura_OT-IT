<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemelo digital celda clasificadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Idea de layout: la escena 3D ocupa toda la pantalla; encima flotan cuatro piezas
   de instrumentacion (encabezado, mandos, telemetria, secuencia) como en un HMI. */
:root{
  color-scheme: dark;
  --fondo:#0f1820;
  --panel:rgba(17,28,38,.86);
  --linea:rgba(160,190,210,.16);
  --tinta:#e6eef3;
  --tenue:#8fa3b1;
  --acento:#39b8c4;
  --ok:#3fd07a;
  --aviso:#f2b233;
  --critico:#f0524a;
  --f-titulo:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-texto:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-dato:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:var(--f-texto);font-size:14px;overflow:hidden}
canvas#escena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#etiquetas{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.etq{position:absolute;left:0;top:0;white-space:nowrap;font:500 11px/1 var(--f-dato);color:var(--tinta);
  background:rgba(10,18,25,.88);border:1px solid var(--linea);border-left:2px solid var(--acento);
  padding:4px 7px;border-radius:2px;will-change:transform}
.etq.activa{border-left-color:var(--ok);color:#fff}
#lineas{position:absolute;inset:0;width:100%;height:100%}
#lineas path{stroke:var(--acento);stroke-width:1.2;fill:none;opacity:.85}
#lineas path.activa{stroke:var(--ok)}
.panel{position:fixed;background:var(--panel);border:1px solid var(--linea);border-radius:4px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
header.panel{top:16px;left:16px;display:flex;align-items:center;gap:14px;padding:10px 14px}
h1{font:700 24px/1 var(--f-titulo);letter-spacing:.04em;text-transform:uppercase;margin:0}
header p{margin:3px 0 0;color:var(--tenue);font-size:12px}
.chip{font:500 11px/1 var(--f-dato);padding:6px 8px;border-radius:2px;border:1px solid var(--linea);color:var(--tenue);text-transform:uppercase;letter-spacing:.06em}
.chip.estado{color:#0c141a;background:var(--aviso);border-color:transparent;font-weight:500}
.chip.estado[data-e="ciclo"]{background:var(--ok)}
.chip.estado[data-e="emergencia"]{background:var(--critico);color:#fff}
h2{font:600 13px/1 var(--f-titulo);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin:0 0 10px}
#mandos{left:16px;top:96px;width:214px;padding:14px;display:flex;flex-direction:column;gap:14px}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:600 13px/1 var(--f-texto);color:var(--tinta);background:rgba(255,255,255,.05);border:1px solid var(--linea);
  border-radius:3px;padding:10px 8px;cursor:pointer}
button:hover{background:rgba(255,255,255,.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
button.marcha{border-color:var(--ok);color:var(--ok)}
button.paro{border-color:#c98a86;color:#f0b3ae}
button.emerg{grid-column:1/-1;background:var(--critico);border-color:var(--critico);color:#fff}
button.reset{grid-column:1/-1}
.vistas{display:flex;flex-wrap:wrap;gap:6px}
.vistas button{padding:7px 8px;font-weight:500;font-size:12px}
.vistas button[aria-pressed="true"]{border-color:var(--acento);color:var(--acento)}
label.fila{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--tenue);font-size:12px}
input[type=range]{width:100%;accent-color:var(--acento)}
input[type=checkbox]{accent-color:var(--acento)}
#telemetria{right:16px;top:16px;width:286px;padding:14px;max-height:calc(100% - 110px);overflow:auto}
.grupo{margin-bottom:12px}
.grupo:last-child{margin-bottom:0}
.tag{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;padding:2px 0;font:400 12px/1.2 var(--f-dato)}
.tag i{width:8px;height:8px;border-radius:50%;background:#2a3944;display:block}
.tag.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tag.on.q i{background:var(--acento);box-shadow:0 0 6px var(--acento)}
.tag.on.r i{background:var(--critico);box-shadow:0 0 6px var(--critico)}
.tag.on.a i{background:var(--aviso);box-shadow:0 0 6px var(--aviso)}
.tag span{color:var(--tinta)}
.tag em{font-style:normal;color:var(--tenue);font-size:11px}
.valor{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font:400 12px/1.2 var(--f-dato);color:var(--tenue)}
.valor b{font-weight:500;color:var(--tinta);font-size:15px;font-variant-numeric:tabular-nums}
#pasos{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:0;padding:0;margin:0;list-style:none;max-width:calc(100% - 32px)}
#pasos li{padding:10px 11px;border-right:1px solid var(--linea);color:var(--tenue);font-size:12px;white-space:nowrap;display:flex;gap:8px;align-items:baseline}
#pasos li:last-child{border-right:0}
#pasos li b{font:700 15px/1 var(--f-titulo);color:var(--tenue)}
#pasos li.activo{color:#fff;background:rgba(57,184,196,.16);box-shadow:inset 0 -2px 0 var(--acento)}
#pasos li.activo b{color:var(--acento)}
#verTel{display:none}
@media (max-width:860px){
  header.panel{right:16px}
  header p{display:none}
  #mandos{top:auto;bottom:70px;left:16px;right:16px;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px;gap:10px}
  #mandos h2,#mandos .ajustes{display:none}
  #mandos>div{flex:1 1 200px}
  .botones{grid-template-columns:repeat(4,1fr)}
  button.emerg,button.reset{grid-column:auto}
  #telemetria{display:none;top:76px;left:16px;right:16px;width:auto;max-height:45%}
  #telemetria.abierta{display:block}
  #verTel{display:block;margin-left:auto}
  #pasos li{display:none;border:0}
  #pasos li.activo{display:flex}
}
</style>
</head>
<body>
<canvas id="escena" aria-label="Vista 3D de la celda clasificadora"></canvas>
<div id="etiquetas"><svg id="lineas" aria-hidden="true"></svg></div>

<header class="panel">
  <div>
    <h1>Celda clasificadora</h1>
    <p>Gemelo digital: clasificación y empaque por material</p>
  </div>
  <span class="chip" id="fuente">Datos simulados</span>
  <span class="chip estado" id="estado">Reposo</span>
  <button id="verTel" type="button">Telemetría</button>
</header>

<section class="panel" id="mandos" aria-label="Mandos">
  <div>
    <h2>Mandos</h2>
    <div class="botones">
      <button class="marcha" id="bMarcha" type="button">Marcha</button>
      <button class="paro" id="bParo" type="button">Paro</button>
      <button class="emerg" id="bEmerg" type="button">Paro de emergencia</button>
      <button class="reset" id="bReset" type="button">Restablecer</button>
    </div>
  </div>
  <div>
    <h2>Vista</h2>
    <div class="vistas" id="vistas"></div>
  </div>
  <div class="ajustes">
    <h2>Ajustes</h2>
    <label class="fila" for="vel">Velocidad <span id="velTxt">1.0x</span></label>
    <input type="range" id="vel" min="0.25" max="3" step="0.25" value="1">
    <label class="fila" for="chkEtq" style="margin-top:10px">Etiquetas en la escena <input type="checkbox" id="chkEtq" checked></label>
  </div>
</section>

<section class="panel" id="telemetria" aria-label="Telemetría"></section>

<ol class="panel" id="pasos" aria-label="Secuencia del proceso">
  <li><b>1</b>Alimentar</li>
  <li><b>2</b>Identificar</li>
  <li><b>3</b>Sujetar y marcar</li>
  <li><b>4</b>Llevar a toma</li>
  <li><b>5</b>Tomar</li>
  <li><b>6</b>Clasificar</li>
  <li><b>7</b>Empacar</li>
</ol>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   1. CONFIGURACION Y TELEMETRIA
   El gemelo solo lee el objeto `tel`. En modo 'simulacion' lo llena un PLC
   simulado; en modo 'api' lo llena una consulta periodica a su backend.
   ===================================================================== */
const CONFIG = {
  fuente: 'simulacion',                 // 'simulacion' | 'api'
  apiUrl: '/api/telemetria/ultimo',     // endpoint que devuelve la ultima muestra en JSON
  intervaloMs: 1000,
};

// Traduce el JSON de su API a los tags del gemelo. Ajustar los nombres de la derecha.
function mapearTelemetria(j) {
  return {
    yA: !!j.v1_alimentar, yB: !!j.v2_sujetar, yC: !!j.v3_marcar, motor_banda: !!j.motor_banda, yZ: !!j.eje_z, yG: !!j.pinza,
    pos_x: j.pos_x ?? 0,                    // 0 = toma, 1-2 = carriles de plastico, 3-4 = carriles de aluminio
    ls1: !!j.ls1, ls2: !!j.ls2, ls3: !!j.ls3, ls4: !!j.ls4, sc1: !!j.sc1, sc2: !!j.sc2, si1: !!j.si1, si2: !!j.si2,
    b0: !!j.pd2_abierto, c1: !!j.ps_abajo, z0: !!j.z0, z1: !!j.z1, x_ok: !!j.x_ok,
    torre_verde: !!j.torre_verde, torre_amarilla: !!j.torre_amarilla, torre_roja: !!j.torre_roja,
    emergencia: !!j.emergencia, marcha: !!j.marcha, material: j.material ?? '',
    piezas_al: j.piezas_al ?? 0, piezas_pl: j.piezas_pl ?? 0, cajas_al: j.cajas_al ?? 0, cajas_pl: j.cajas_pl ?? 0,
    t_ciclo: j.t_ciclo ?? 0, presion: j.presion ?? 6.0, paso: j.paso ?? 0,
  };
}

const tel = {
  marcha: true, emergencia: false,
  yA: false, yB: false, yC: false, motor_banda: false, yZ: false, yG: false, pos_x: 0,
  ls1: true, ls2: false, ls3: false, ls4: false, sc1: false, sc2: false, si1: false, si2: true,
  b0: true, c1: false, z0: true, z1: false, x_ok: true,
  torre_verde: false, torre_amarilla: true, torre_roja: false,
  material: '', pos_mm: 0,
  piezas_al: 0, piezas_pl: 0, cajas_al: 0, cajas_pl: 0, t_ciclo: 0, presion: 6.0, paso: 0,
};
const SIM = CONFIG.fuente === 'simulacion';

/* =====================================================================
   2. ESCENA
   ===================================================================== */
const canvas = document.getElementById('escena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c252d);
scene.fog = new THREE.Fog(0x1c252d, 10, 30);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
camera.position.set(2.25, 1.95, 2.9);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.15, 0.95, 0);
controls.enableDamping = true;
controls.minDistance = 0.5; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight(0xe6edf3, 0x3a4148, 0.75));
const sol = new THREE.DirectionalLight(0xffffff, 2.2);
sol.position.set(2.2, 4.2, 2.6);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 0.5, far: 12 });
sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.01;
scene.add(sol);
const relleno = new THREE.DirectionalLight(0x9fc4e0, 0.5);
relleno.position.set(-3, 2, -1.5);
scene.add(relleno);

/* ---------- texturas hechas con canvas ---------- */
function tex(w, h, dibuja, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  dibuja(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
const tBanda = tex(128, 128, (g, w, h) => {
  g.fillStyle = '#3f7d5c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#356d50'; g.lineWidth = 3;
  for (let y = -16; y < h + 16; y += 32) { g.beginPath(); g.moveTo(20, y); g.lineTo(60, y + 16); g.lineTo(20, y + 32); g.stroke();
    g.beginPath(); g.moveTo(84, y); g.lineTo(124, y + 16); g.lineTo(84, y + 32); g.stroke(); }
  g.fillStyle = '#356d50'; g.fillRect(0, 0, 2, h);
}, [12, 1]);
const tRanuras = tex(64, 64, (g, w, h) => {
  g.fillStyle = '#b4bbc1'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#a7aeb5'; for (let i = 0; i < 40; i++) g.fillRect(0, Math.random() * h, w, 1);
  g.fillStyle = '#3a4047'; g.fillRect(0, 27, w, 10);
  g.fillStyle = '#7d858c'; g.fillRect(0, 25, w, 2); g.fillRect(0, 37, w, 2);
}, [1, 19]);
const tPerfil = tex(64, 64, (g, w, h) => {
  g.fillStyle = '#b9c0c6'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#353b42'; g.fillRect(0, 24, w, 16);
  g.fillStyle = '#868e96'; g.fillRect(0, 21, w, 3); g.fillRect(0, 40, w, 3);
});
const tPerfilV = tPerfil.clone(); tPerfilV.center.set(0.5, 0.5); tPerfilV.rotation = Math.PI / 2; tPerfilV.needsUpdate = true;
const tPiso = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#2b3138'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * 0.045})`;
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
}, [10, 10]);
const tBrillo = tex(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});
function tRotulo(lineas, { fondo = '#cdd2d6', banda = '#33414c', w = 128, h = 256 } = {}) {
  return tex(w, h, (g) => {
    g.fillStyle = fondo; g.fillRect(0, 0, w, h);
    g.fillStyle = banda; g.fillRect(0, 0, w, 46);
    g.fillStyle = '#fff'; g.font = '600 17px Arial'; g.textAlign = 'center';
    g.fillText(lineas[0], w / 2, 20); g.font = '13px Arial'; g.fillText(lineas[1] || '', w / 2, 38);
    g.fillStyle = '#b3babf'; g.fillRect(8, 60, w - 16, h - 72);
    g.strokeStyle = '#8f979d'; g.strokeRect(8.5, 60.5, w - 17, h - 73);
  });
}

/* ---------- materiales ---------- */
const S = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const mat = {
  alu: S(0xc3c9ce, { metalness: 0.9, roughness: 0.38 }),
  aluOsc: S(0x7d868e, { metalness: 0.85, roughness: 0.45 }),
  perfil: S(0xffffff, { metalness: 0.75, roughness: 0.42, map: tPerfil }),
  perfilV: S(0xffffff, { metalness: 0.75, roughness: 0.42, map: tPerfilV }),
  cromo: S(0xf2f4f6, { metalness: 1, roughness: 0.12 }),
  acero: S(0xaab1b8, { metalness: 1, roughness: 0.3 }),
  pieza: S(0xbcc3ca, { metalness: 1, roughness: 0.28 }),
  negro: S(0x16191c, { roughness: 0.7 }),
  goma: S(0x1b1e22, { roughness: 0.9 }),
  gris: S(0x6c757d, { roughness: 0.7 }),
  grisClaro: S(0xc9ced2, { roughness: 0.65 }),
  panel: S(0x8d969d, { metalness: 0.4, roughness: 0.6 }),
  azul: S(0x2d6fb8, { roughness: 0.45 }),
  azulMotor: S(0x34587c, { metalness: 0.3, roughness: 0.5 }),
  laton: S(0xc9a44a, { metalness: 1, roughness: 0.3 }),
  naranja: S(0xe59a14, { roughness: 0.5 }),
  amarillo: S(0xf2c21a, { roughness: 0.55 }),
  manguera: S(0x2f84d8, { roughness: 0.35 }),
  cable: S(0x24282c, { roughness: 0.8 }),
  transl: S(0x9fd2ea, { roughness: 0.15, transparent: true, opacity: 0.35 }),
};
const led = (color) => new THREE.MeshStandardMaterial({ color: 0x20262b, emissive: color, emissiveIntensity: 0, roughness: 0.4 });
const prende = (m, on, fuerza = 2.4) => { m.emissiveIntensity = on ? fuerza : 0; };

/* ---------- ayudas de geometria ---------- */
function alta(m, padre, x, y, z) { m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; padre && padre.add(m); return m; }
const caja = (w, h, d, m, x = 0, y = 0, z = 0, p) => alta(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), p, x, y, z);
const cajaR = (w, h, d, m, x = 0, y = 0, z = 0, p, r) =>
  alta(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r ?? Math.min(w, h, d) * 0.16), m), p, x, y, z);
function cil(r, largo, m, x = 0, y = 0, z = 0, eje = 'y', p, seg = 24, r2) {
  const o = alta(new THREE.Mesh(new THREE.CylinderGeometry(r2 ?? r, r, largo, seg), m), p, x, y, z);
  if (eje === 'x') o.rotation.z = Math.PI / 2; else if (eje === 'z') o.rotation.x = Math.PI / 2;
  return o;
}
function manguera(puntos, radio = 0.004, m = mat.manguera, p) {
  const curva = new THREE.CatmullRomCurve3(puntos.map(q => new THREE.Vector3(...q)), false, 'catmullrom', 0.5);
  return alta(new THREE.Mesh(new THREE.TubeGeometry(curva, 40, radio, 8), m), p, 0, 0, 0);
}

/* ---------- nave industrial: piso, muros, estanteria, cerca de seguridad ---------- */
const tHmi = tex(256, 160, (g) => { g.fillStyle = '#0d1820'; g.fillRect(0, 0, 256, 160); });
{
  const N = new THREE.Group(); scene.add(N);          // lejos: sin sombras propias
  const C = new THREE.Group(); scene.add(C);          // junto a la celda: con sombras
  const tConcreto = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#8b9196'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
    for (let i = 0; i < 14; i++) { g.fillStyle = `rgba(40,44,48,${0.03 + Math.random() * 0.05})`; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 30 + Math.random() * 70, 14 + Math.random() * 30, Math.random() * 3, 0, 7); g.fill(); }
    g.strokeStyle = 'rgba(30,34,38,.55)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
  }, [8, 8]);
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(48, 48), S(0xffffff, { map: tConcreto, roughness: 0.5, metalness: 0.05 }));
  piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; scene.add(piso);
  const plano = (w, d, color, x, z, y = 0.003) => { const f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
    f.rotation.x = -Math.PI / 2; f.position.set(x, y, z); f.receiveShadow = true; scene.add(f); return f; };
  // pasillo peatonal verde y delimitacion amarilla de la celda

  pist.Z.ext = hacia(pist.Z.ext, tel.yZ ? 1 : 0, dt / 0.38);

  if (tel.yA && !mundo.prev.yA) tomarPieza();
  mundo.prev.yA = tel.yA;
  if (pist.A.ext < 0.15) mundo.caida = hacia(mundo.caida, 0, dt * 7);

  const tcpY = Y_ARRIBA - pist.Z.ext * CARRERA_Z;

    }

    if (p) { p.st = 'pinza'; carro.lleva = p; }
  }

  }

    case 'A_EXT': T.yA = true; T.pos_x = 0; plc.visto = plc.metal = false; T.material = ''; if (T.ls2) ir('A_RET'); break;
    case 'A_RET': T.yA = false; T.motor_banda = true; lee(); if (T.ls1) ir('A_IDENT'); break;
    case 'A_IDENT': lee(); if (!T.sc1 && plc.visto) { T.material = plc.metal ? 'al' : 'pl'; ir('A_MARCA'); } break;
    case 'A_MARCA': T.motor_banda = !T.sc2; if (T.sc2) ir('SUJETA'); break;                // SC-2 detiene la banda
    case 'SUJETA': T.motor_banda = false; T.yB = plc.t > 0.1; if (T.ls3) ir('MARCA'); break; // PD-2 sujeta, LS-3 confirma
    case 'MARCA': T.yC = true; if (T.c1) ir('MARCA_ESPERA'); break;                        // PS baja con la 3/2

    case 'A_TOMA': T.motor_banda = !T.ls4; if (T.ls4 && T.si2 && T.z0) ir('Z_BAJA'); break;   // LS-4 = pieza en el tope
    case 'Z_BAJA': T.motor_banda = false; T.yZ = true; if (T.z1) ir('CIERRA'); break;
    case 'CIERRA': T.yG = true; if (plc.t > 0.3) ir('Z_SUBE'); break;

    case 'X_IR': if (plc.t > 0.1 && T.x_ok && cajas[T.material === 'al' ? 1 : 0].est === 'llenando') ir('Z_BAJA2'); break;

  for (const k in pist) pist[k].vastago.position.x = pist[k].ext * pist[k].carrera;
  prende(pist.B.leds[0], tel.b0); prende(pist.B.leds[1], tel.ls3); prende(pist.C.leds[1], tel.c1); prende(pist.Z.leds[0], tel.z0); prende(pist.Z.leds[1], tel.z1);
  for (const { d, s } of pist.Z.dedos) d.position.z = s * (0.0375 - carro.g * 0.009);
  carroG.position.x = carro.x; pintarCadena(carro.x);
  banderas.forEach((m, i) => prende(m, Math.abs(carro.x - XPOS[i]) < 0.004));
  cajas.forEach((c, b) => {
    c.g.position.set(CAJA_X[b], CAJA_Y, CAJA_Z + c.dz); c.g.scale.setScalar(Math.max(0.001, c.esc));
    for (const { piv, s } of c.solapas) piv.rotation.z = -s * (Math.PI / 2) * (1 - c.cierre) * 1.02 + s * 0.02;
  });
  for (const p of piezas) {
    p.m.visible = true; p.m.scale.setScalar(1);
    if (p.st === 'almacen') { p.m.visible = p.idx < VISIBLES_ALM; p.m.position.set(X_MAG, Y_PIEZA + (p.idx + mundo.caida) * 0.05, ZB); p.m.rotation.set(0, 0, 0); }
    else if (p.st === 'caja') {
      const c = cajas[p.caja]; p.m.scale.setScalar(Math.max(0.001, c.esc));
      p.m.position.set(c.g.position.x + p.dest[0] * c.esc, CAJA_Y + p.dest[1] * c.esc, CAJA_Z + c.dz + p.dest[2] * c.esc); p.m.rotation.set(0, 0, 0);
    } else { p.m.position.set(p.x, p.y, p.z); p.m.rotation.set(p.rx, 0, 0); }
  }
  for (const k in sens) prende(sens[k].m, tel[k]);
  for (const [n, k] of [['verde', 'torre_verde'], ['amarilla', 'torre_amarilla'], ['roja', 'torre_roja']]) {
    torre[n].m.emissiveIntensity = tel[k] ? 2.6 : 0.05; torre[n].halo.material.opacity = tel[k] ? 0.75 : 0;
  }
  [tel.yA, tel.yB, tel.yC, tel.yZ, tel.yG, !tel.x_ok].forEach((on, i) => prende(valv[i].m, on));
  ['ls1', 'ls2', 'ls3', 'ls4', 'sc1', 'sc2', 'si1', 'si2', 'b0', 'c1', 'z0', 'z1', 'x_ok', 'marcha'].forEach((k, i) => prende(ioLeds.di[i], tel[k], 3));
  ['yA', 'yB', 'yC', 'motor_banda', 'yZ', 'yG', 'torre_verde', 'torre_amarilla', 'torre_roja'].forEach((k, i) => prende(ioLeds.dq[i], tel[k], 3));
  prende(cpuLeds.dc, true); prende(cpuLeds.run, !tel.emergencia); prende(cpuLeds.stop, false); prende(cpuLeds.sf, tel.emergencia);
  luzBoton.marcha.emissiveIntensity = tel.marcha ? 1.6 : 0.05;
  luzBoton.paro.emissiveIntensity = (!tel.marcha && !tel.emergencia) ? 0.9 : 0.05;
  luzBoton.reset.emissiveIntensity = tel.emergencia ? 1.6 : 0.05;
  luzBoton.hongo.position.y = tel.emergencia ? 0.069 : 0.076;
  aguja.rotation.z = Math.PI * 0.75 - (tel.presion / 10) * Math.PI * 1.5;
  if (tel.motor_banda) {
    const dx = V_BANDA * dtReal;
    tBanda.offset.x -= dx / (L_BANDA / 12);
    for (const g of partesGiran) g.rotation.z -= dx / 0.03;
  }
}

const ETQ = [

  ['LS-1', [-0.706, Y_PIEZA - 0.06, ZB + 0.075], 'ls1'], ['LS-2', [-0.541, Y_PIEZA - 0.06, ZB + 0.075], 'ls2'],

  ['SI-2', [X_P - 0.1, 0.65, ZG + 0.065], 'si2'], ['Pórtico: eje X', [0.93, 0.66, ZG]],

  ['Carriles', [0.86, 0.2, -0.05]], ['Cajas', [0.86, 0.12, 0.3]], ['Tarima de producto', [1.57, -0.62, 0.35]],
  ['PLC', [-0.66, 0.34, -0.33]], ['Electroválvulas 5/2 y 3/2', [-0.18, 0.21, -0.4]], ['Torreta', [-0.93, 0.55, -0.41]], ['PE y botonera', [-0.7, 0.14, 0.34]],

});
const medirEtq = () => { for (const q of ETQ) { q.el.style.display = ''; q.w = q.el.offsetWidth; q.h = q.el.offsetHeight; } };
medirEtq(); document.fonts?.ready.then(medirEtq);
let obst = [], tObst = 0;
const _v = new THREE.Vector3();
// posiciones candidatas de la etiqueta respecto a su punto: [lado, desplazamiento vertical]
const CAND = [[1, -28], [-1, -28], [1, 12], [-1, 12], [1, -58], [-1, -58], [1, 42], [-1, 42], [1, -90], [-1, -90], [1, 74], [-1, 74]];
const choca = (a, b) => a[0] < b[2] + 5 && a[2] > b[0] - 5 && a[1] < b[3] + 4 && a[3] > b[1] - 4;
function pintarEtiquetas(w, h) {
  const lejos = camera.position.distanceTo(controls.target) > 2.4;     // las etiquetas de detalle solo de cerca
  if (performance.now() - tObst > 400) {       // los paneles de la interfaz cuentan como zona ocupada
    tObst = performance.now();
    obst = ['mandos', 'telemetria', 'pasos'].map((id) => $(id).getBoundingClientRect()).concat(document.querySelector('header').getBoundingClientRect())
      .filter((r) => r.width).map((r) => [r.left, r.top, r.right, r.bottom]);
  }
  const ocup = obst.slice();
  for (const q of ETQ) {
    if (q.fn) q.pos.set(...q.fn()).add(E.position);
    _v.copy(q.pos).project(camera);
    let ok = _v.z < 1 && Math.abs(_v.x) < 1 && Math.abs(_v.y) < 1 && !(q.det && lejos);
    const ax = (_v.x + 1) / 2 * w, ay = (1 - _v.y) / 2 * h;
    let caja = null;
    if (ok) {
      const orden = q.cand >= 0 ? [q.cand, ...CAND.keys()] : [...CAND.keys()];      // primero la posicion anterior, para que no brinque
      for (const i of orden) {
        const [lado, dy] = CAND[i], x = lado > 0 ? ax + 20 : ax - 20 - q.w, y = ay + dy;
        const r = [x, y, x + q.w, y + q.h];

    if (!ok) continue;
    ocup.push(caja); ocup.push([ax - 4, ay - 4, ax + 4, ay + 4]);
    q.el.style.transform = `translate(${caja[0].toFixed(1)}px,${caja[1].toFixed(1)}px)`;
    const lx = caja[0] > ax ? caja[0] : caja[2], ly = (caja[1] + caja[3]) / 2;
    q.ln.setAttribute('d', `M${ax.toFixed(1)} ${ay.toFixed(1)} L${lx.toFixed(1)} ${ly.toFixed(1)} M${(ax - 2.5).toFixed(1)} ${ay.toFixed(1)} a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0`);
    const on = q.tag && !!tel[q.tag]; q.el.classList.toggle('activa', on); q.ln.classList.toggle('activa', on);
  }
}

  punt.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);

};

/* =====================================================================
   8. BUCLE PRINCIPAL
   ===================================================================== */
let W = 0, H = 0;
function ajustar() {

  if (w === W && h === H) return;
  W = w; H = h; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
const reloj = new THREE.Clock(); let acum = 0, tHud = 0;
const PASO_FIJO = 1 / 120;
function cuadro() {
  const dtReal = Math.min(reloj.getDelta(), 0.1);

  while (acum >= PASO_FIJO) { if (SIM) plcPaso(PASO_FIJO); plantaPaso(PASO_FIJO); acum -= PASO_FIJO; }
  pintar(dt);
  if (vuelo) {

    if (vuelo.t >= 1) vuelo = null;

}
