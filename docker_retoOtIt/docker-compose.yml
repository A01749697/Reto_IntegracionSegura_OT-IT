name: retootit

services:
  db:
    image: postgres:18-alpine
    container_name: reto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reto
      POSTGRES_USER: reto_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reto_admin -d reto"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
