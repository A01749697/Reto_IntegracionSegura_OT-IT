name: retootit

services:
  db:
    image: postgres:18-alpine
    container_name: reto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reto
      POSTGRES_USER: reto_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reto_admin -d reto"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-ingest:
    build:
      context: ./backend_retoOtIt
    container_name: reto-api-ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_INGEST_PASSWORD: ${DB_INGEST_PASSWORD:?falta DB_INGEST_PASSWORD}
      API_INGEST_TOKEN: ${API_INGEST_TOKEN:?falta API_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/ingest/salud"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-panel:
    build:
      context: ./backend_panel_retoOtIt
    container_name: reto-api-panel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:?falta DB_READER_PASSWORD}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD:?falta DB_PANEL_PASSWORD}
      URL_PUBLICA: ${URL_PUBLICA:?falta URL_PUBLICA}
      CORREO_REMITENTE: ${CORREO_REMITENTE:?falta CORREO_REMITENTE}
      AWS_REGION: ${AWS_REGION:-us-east-2}
    ports:
      - "127.0.0.1:3002:3002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/api/panel/salud"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
