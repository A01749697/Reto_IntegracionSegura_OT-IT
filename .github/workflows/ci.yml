name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_retoOtIt
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend_retoOtIt/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el codigo (ESLint)
        run: npm run lint

      - name: Revisar el formato (Prettier)
        run: npm run format:check

      - name: Correr las pruebas (Vitest)
        run: npm test

      - name: Compilar la pagina
        run: npm run build

      - name: Guardar la pagina compilada
        uses: actions/upload-artifact@v7
        with:
          name: pagina-compilada
          path: frontend_retoOtIt/dist
          retention-days: 7

  api_ingest:
    name: API receptora (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_retoOtIt
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend_retoOtIt/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el codigo (ESLint)
        run: npm run lint

      - name: Revisar el formato (Prettier)
        run: npm run format:check

      - name: Correr las pruebas (Vitest)
        run: npm test

      - name: Compilar la API
        run: npm run build

      - name: Construir la imagen de Docker
        run: docker build -t api-ingest-prueba .

  deploy:
    name: Desplegar al servidor
    needs: [frontend, api_ingest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: despliegue
      cancel-in-progress: false
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Descargar la pagina compilada
        uses: actions/download-artifact@v7
        with:
          name: pagina-compilada
          path: dist

      - name: Preparar llave SSH y huella del servidor
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Copiar la pagina al servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "$SERVER_USER@$SERVER_HOST:/var/www/reto/"

      - name: Copiar la configuracion de Docker al servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rlz --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            docker_retoOtIt/docker-compose.yml "$SERVER_USER@$SERVER_HOST:/opt/docker_retoOtIt/"

      - name: Copiar el codigo de la API al servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            backend_retoOtIt/ "$SERVER_USER@$SERVER_HOST:/opt/docker_retoOtIt/backend_retoOtIt/"

      - name: Levantar los contenedores
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/docker_retoOtIt
          test -f .env || { echo "Falta el archivo .env en /opt/docker_retoOtIt"; exit 1; }
          for v in DB_ADMIN_PASSWORD DB_INGEST_PASSWORD DB_READER_PASSWORD; do
            grep -Eq "^${v}=[A-Za-z0-9_]{12,}$" .env || { echo "Falta o es invalida la variable $v en .env"; exit 1; }
          done
          grep -Eq '^API_INGEST_TOKEN=[0-9a-f]{64}$' .env || { echo "Falta o es invalida la variable API_INGEST_TOKEN en .env"; exit 1; }
          sudo docker compose up -d --build --wait --wait-timeout 120
          sudo docker compose ps
          REMOTE

      - name: Comprobar que la pagina responde
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl -ksS --fail --max-time 20 -o /dev/null "https://$SERVER_HOST/"

      - name: Comprobar que la API responde
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl -ksS --fail --max-time 20 "https://$SERVER_HOST/api/ingest/salud" | grep -q '"estado":"ok"'
